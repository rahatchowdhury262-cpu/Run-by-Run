<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run-by-Run</title>

<style>
* {
  box-sizing: border-box;
  touch-action: none;
}

body {
  margin: 0;
  background: #222;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

#game {
  background: #87ceeb;
  border: 3px solid white;
  width: 95%;
  max-width: 800px;
}

.controls {
  margin-top: 15px;
  display: flex;
  gap: 12px;
}

button {
  width: 75px;
  height: 55px;
  border: none;
  border-radius: 12px;
  background: white;
  font-size: 25px;
  font-weight: bold;
}

#jump {
  width: 100px;
}
</style>
</head>

<body>

<canvas id="game" width="800" height="400"></canvas>

<div class="controls">
  <button id="left">⬅️</button>
  <button id="jump">⬆️</button>
  <button id="right">➡️</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player;
let enemy;
let coins;
let score;
let lives;
let gameOver;

const gravity = 0.7;
const ground = 350;

function resetGame() {

  player = {
    x: 100,
    y: 300,
    width: 40,
    height: 50,
    velocityY: 0,
    speed: 5,
    jumping: false
  };

  enemy = {
    x: 650,
    y: 310,
    width: 40,
    height: 40,
    speed: 3
  };

  coins = [
    {x: 300, y: 300, r: 10, collected: false},
    {x: 430, y: 250, r: 10, collected: false},
    {x: 560, y: 300, r: 10, collected: false},
    {x: 700, y: 220, r: 10, collected: false}
  ];

  score = 0;
  lives = 3;
  gameOver = false;
}

resetGame();

function drawPlayer() {

  ctx.fillStyle = "#ff3333";
  ctx.fillRect(
    player.x,
    player.y,
    player.width,
    player.height
  );
}

function drawEnemy() {

  ctx.fillStyle = "#111";

  ctx.fillRect(
    enemy.x,
    enemy.y,
    enemy.width,
    enemy.height
  );

  ctx.fillStyle = "red";
  ctx.fillRect(enemy.x + 8, enemy.y + 10, 7, 7);
  ctx.fillRect(enemy.x + 25, enemy.y + 10, 7, 7);
}

function drawCoins() {

  coins.forEach(coin => {

    if (!coin.collected) {

      ctx.beginPath();

      ctx.fillStyle = "gold";

      ctx.arc(
        coin.x,
        coin.y,
        coin.r,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.strokeStyle = "#d99b00";
      ctx.stroke();
    }
  });
}

function drawGround() {

  ctx.fillStyle = "#333";

  ctx.fillRect(
    0,
    ground,
    canvas.width,
    50
  );
}

function drawHUD() {

  ctx.fillStyle = "#111";
  ctx.font = "20px Arial";

  ctx.fillText(
    "Score: " + score,
    20,
    30
  );

  ctx.fillText(
    "❤️ " + lives,
    700,
    30
  );
}

function collision(a, b) {

  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

function update() {

  if (gameOver) return;

  // Player movement
  player.x += player.speed;

  // Gravity
  player.velocityY += gravity;
  player.y += player.velocityY;

  // Ground
  if (player.y + player.height >= ground) {

    player.y = ground - player.height;

    player.velocityY = 0;
    player.jumping = false;
  }

  // Enemy movement
  enemy.x -= enemy.speed;

  if (enemy.x < -50) {

    enemy.x = canvas.width + 100;

    enemy.speed += 0.2;
  }

  // Enemy collision
  if (collision(player, enemy)) {

    lives--;

    player.x = 100;
    enemy.x = canvas.width + 150;

    if (lives <= 0) {

      gameOver = true;
    }
  }

  // Coin collision
  coins.forEach(coin => {

    if (!coin.collected) {

      let dx =
        player.x + player.width / 2 - coin.x;

      let dy =
        player.y + player.height / 2 - coin.y;

      let distance =
        Math.sqrt(dx * dx + dy * dy);

      if (distance < 35) {

        coin.collected = true;

        score += 10;
      }
    }
  });

  // New coins
  if (coins.every(c => c.collected)) {

    coins = [
      {x: 250, y: 280, r: 10, collected: false},
      {x: 400, y: 220, r: 10, collected: false},
      {x: 550, y: 280, r: 10, collected: false},
      {x: 700, y: 200, r: 10, collected: false}
    ];
  }

  // Screen boundary
  if (player.x < 0)
    player.x = 0;

  if (player.x > canvas.width - player.width)
    player.x = canvas.width - player.width;
}

function draw() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawGround();
  drawCoins();
  drawPlayer();
  drawEnemy();
  drawHUD();

  if (gameOver) {

    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.font = "45px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
      "GAME OVER",
      canvas.width / 2,
      170
    );

    ctx.font = "25px Arial";

    ctx.fillText(
      "Score: " + score,
      canvas.width / 2,
      220
    );

    ctx.fillText(
      "Tap / Space to Restart",
      canvas.width / 2,
      270
    );

    ctx.textAlign = "left";
  }
}

function gameLoop() {

  update();
  draw();

  requestAnimationFrame(gameLoop);
}

gameLoop();

function jump() {

  if (!player.jumping && !gameOver) {

    player.velocityY = -13;
    player.jumping = true;
  }

  else if (gameOver) {

    resetGame();
  }
}

// Keyboard
document.addEventListener("keydown", e => {

  if (e.key === "ArrowLeft") {
    player.x -= 25;
  }

  if (e.key === "ArrowRight") {
    player.x += 25;
  }

  if (e.key === " " || e.key === "ArrowUp") {
    jump();
  }
});

// Mobile buttons
document.getElementById("left")
.addEventListener("touchstart", e => {

  e.preventDefault();

  if (!gameOver)
    player.x -= 35;
});

document.getElementById("right")
.addEventListener("touchstart", e => {

  e.preventDefault();

  if (!gameOver)
    player.x += 35;
});

document.getElementById("jump")
.addEventListener("touchstart", e => {

  e.preventDefault();

  jump();
});

// Tap game to restart
canvas.addEventListener("touchstart", e => {

  if (gameOver)
    resetGame();
});

</script>

</body>
</html>
