<!DOCTYPE html>
<html>
<head>
  <title>Simple Run Game</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
    }

    canvas {
      background: #87ceeb;
      border: 3px solid white;
      max-width: 95%;
    }
  </style>
</head>

<body>

<canvas id="game" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
  x: 100,
  y: 300,
  width: 40,
  height: 50,
  velocityY: 0,
  jumping: false
};

let obstacle = {
  x: 800,
  y: 330,
  width: 35,
  height: 70,
  speed: 6
};

let gravity = 0.8;
let score = 0;
let gameOver = false;

function jump() {
  if (!player.jumping && !gameOver) {
    player.velocityY = -15;
    player.jumping = true;
  }

  if (gameOver) {
    location.reload();
  }
}

document.addEventListener("keydown", function(e) {
  if (e.code === "Space" || e.code === "ArrowUp") {
    jump();
  }
});

canvas.addEventListener("click", jump);
canvas.addEventListener("touchstart", jump);

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Ground
  ctx.fillStyle = "#333";
  ctx.fillRect(0, 350, canvas.width, 50);

  // Player
  player.velocityY += gravity;
  player.y += player.velocityY;

  if (player.y >= 300) {
    player.y = 300;
    player.velocityY = 0;
    player.jumping = false;
  }

  ctx.fillStyle = "#ff3333";
  ctx.fillRect(
    player.x,
    player.y,
    player.width,
    player.height
  );

  // Obstacle
  obstacle.x -= obstacle.speed;

  if (obstacle.x < -obstacle.width) {
    obstacle.x = canvas.width;
    score++;
    obstacle.speed += 0.2;
  }

  ctx.fillStyle = "#222";
  ctx.fillRect(
    obstacle.x,
    obstacle.y,
    obstacle.width,
    obstacle.height
  );

  // Collision
  if (
    player.x < obstacle.x + obstacle.width &&
    player.x + player.width > obstacle.x &&
    player.y < obstacle.y + obstacle.height &&
    player.y + player.height > obstacle.y
  ) {
    gameOver = true;
  }

  // Score
  ctx.fillStyle = "#111";
  ctx.font = "25px Arial";
  ctx.fillText("Score: " + score, 20, 35);

  if (gameOver) {
    ctx.fillStyle = "red";
    ctx.font = "50px Arial";
    ctx.fillText("GAME OVER", 270, 180);

    ctx.fillStyle = "#111";
    ctx.font = "22px Arial";
    ctx.fillText("Tap / Space to Restart", 290, 220);

    return;
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
  </html>
